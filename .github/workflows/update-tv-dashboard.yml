name: Update TV Dashboard

on:
  workflow_dispatch:

  #schedule:
  #  - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update dashboard
        env:
          HELP_SCOUT_APP_ID: ${{ secrets.HELP_SCOUT_APP_ID }}
          HELP_SCOUT_APP_SECRET: ${{ secrets.HELP_SCOUT_APP_SECRET }}
        run: python3 update_dashboard.py

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp support_tv.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
