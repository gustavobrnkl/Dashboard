<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased">
  <div class="min-h-screen p-8 md:p-12 lg:p-16">
    <div class="mx-auto max-w-[1800px]">
      <header class="mb-10 border-b border-white/10 pb-6">
        <h1 class="text-5xl font-semibold tracking-tight lg:text-7xl">Support</h1>
      </header>

      <section class="grid grid-cols-1 gap-6 sm:grid-cols-3">
        <article class="min-w-0 rounded-[2rem] border border-white/10 bg-white/5 p-8 shadow-2xl shadow-black/30 backdrop-blur">
          <div class="text-base uppercase tracking-[0.3em] text-slate-400">Open Tickets</div>
          <div class="mt-6 text-7xl font-semibold tracking-tight lg:text-8xl">128</div>
          <div class="mt-8 flex items-center gap-3 text-cyan-300">
            <span class="text-2xl">+5%</span>
          </div>
        </article>

        <article class="min-w-0 rounded-[2rem] border border-white/10 bg-white/5 p-8 shadow-2xl shadow-black/30 backdrop-blur">
          <div class="text-base uppercase tracking-[0.3em] text-slate-400">New Today</div>
          <div class="mt-6 text-7xl font-semibold tracking-tight lg:text-8xl">34</div>
          <div class="mt-8 flex items-center gap-3 text-emerald-300">
            <span class="text-2xl">+12%</span>
          </div>
        </article>

        <article class="min-w-0 rounded-[2rem] border border-white/10 bg-white/5 p-8 shadow-2xl shadow-black/30 backdrop-blur">
          <div class="text-base uppercase tracking-[0.3em] text-slate-400 whitespace-nowrap">Time to Close</div>
          <div class="mt-6 text-7xl font-semibold tracking-tight lg:text-8xl">18.4h</div>
          <div class="mt-8 flex items-center gap-3 text-amber-300">
            <span class="text-2xl">+8%</span>
          </div>
        </article>
      </section>

      <section class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-3">
        <article class="sm:col-span-3 rounded-[2rem] border border-white/10 bg-white/5 p-8 shadow-2xl shadow-black/30 backdrop-blur">
          <div class="mb-8 flex items-end justify-between gap-4">
            <div>
              <h2 class="mt-2 text-4xl font-semibold tracking-tight lg:text-5xl">Top Issues · 30 Days</h2>
            </div>
          </div>

          <div class="space-y-5">
            <div>
              <div class="mb-2 flex items-center justify-between text-2xl lg:text-3xl">
                <span class="font-medium text-white">Device Offline</span>
                <span class="text-slate-300">42</span>
              </div>
              <div class="h-5 rounded-full bg-slate-800">
                <div class="h-5 w-[84%] rounded-full bg-cyan-300"></div>
              </div>
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between text-2xl lg:text-3xl">
                <span class="font-medium text-white">Billing / Payments</span>
                <span class="text-slate-300">31</span>
              </div>
              <div class="h-5 rounded-full bg-slate-800">
                <div class="h-5 w-[62%] rounded-full bg-cyan-300"></div>
              </div>
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between text-2xl lg:text-3xl">
                <span class="font-medium text-white">Setup Issues</span>
                <span class="text-slate-300">24</span>
              </div>
              <div class="h-5 rounded-full bg-slate-800">
                <div class="h-5 w-[48%] rounded-full bg-cyan-300"></div>
              </div>
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between text-2xl lg:text-3xl">
                <span class="font-medium text-white">Firmware Update</span>
                <span class="text-slate-300">19</span>
              </div>
              <div class="h-5 rounded-full bg-slate-800">
                <div class="h-5 w-[38%] rounded-full bg-cyan-300"></div>
              </div>
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between text-2xl lg:text-3xl">
                <span class="font-medium text-white">Mobile App</span>
                <span class="text-slate-300">14</span>
              </div>
              <div class="h-5 rounded-full bg-slate-800">
                <div class="h-5 w-[28%] rounded-full bg-cyan-300"></div>
              </div>
            </div>
          </div>
        </article>
      </section>
    </div>
  </div>
</body>
</html>
